<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GreenTuber VIP Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --gt-green: #22c55e; --gt-bg: #0f0f0f; }
    body { background-color: var(--gt-bg); color: #f1f1f1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 70px; user-select: none; }
    
    .glass-effect { background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(12px); }
    .accent-green { color: var(--gt-green); }
    .bg-accent-green { background-color: var(--gt-green); }

    /* Skeleton Loading Animation */
    .skeleton { background: linear-gradient(90deg, #181818 25%, #282828 50%, #181818 75%); background-size: 200% 100%; animation: skeleton-loading 1.2s infinite; }
    @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    #bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15,15,15,0.95); backdrop-filter: blur(10px); border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #aaa; font-size: 10px; cursor: pointer; }
    .nav-item.active { color: var(--gt-green); font-weight: 600; }

    #player-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--gt-bg); z-index: 200; display: none; flex-direction: column; overflow-y: auto; }
    .pip-mode { position: fixed !important; bottom: 75px !important; right: 12px !important; width: 240px !important; height: auto !important; z-index: 300 !important; border-radius: 12px; overflow: hidden; border: 2px solid var(--gt-green); }
    .pip-mode #player-info-container { display: none !important; }
  </style>
</head>
<body class="antialiased">

  <!-- Header -->
  <header class="sticky top-0 glass-effect z-50 px-4 py-3 border-b border-[#222] flex items-center justify-between">
    <div class="flex items-center gap-2 cursor-pointer" onclick="switchTab('home')">
      <div class="w-8 h-8 bg-accent-green rounded-lg flex items-center justify-center">
        <i class="fa-solid fa-play text-black text-sm"></i>
      </div>
      <span class="text-lg font-black tracking-wider text-white">Green<span class="accent-green">Tuber</span> <span class="text-[10px] bg-green-500 text-black px-1.5 py-0.5 rounded font-black">PRO</span></span>
    </div>
    <div class="flex items-center gap-4 text-white">
      <i class="fa-solid fa-arrows-rotate text-sm cursor-pointer hover:accent-green" title="Làm mới" onclick="reloadCurrentTab()"></i>
      <i class="fa-solid fa-magnifying-glass text-lg cursor-pointer hover:accent-green" onclick="toggleSearch()"></i>
    </div>
  </header>

  <!-- Category Bar -->
  <div id="category-bar" class="px-4 py-2.5 bg-[#0f0f0f] border-b border-[#222] flex gap-2 overflow-x-auto whitespace-nowrap text-xs">
    <button onclick="filterCategory(this, 'trending')" class="cat-btn bg-white text-black font-semibold px-3.5 py-1.5 rounded-full">Tất cả</button>
    <button onclick="filterCategory(this, 'music')" class="cat-btn bg-[#222] text-slate-300 px-3.5 py-1.5 rounded-full">Âm nhạc</button>
    <button onclick="filterCategory(this, 'gaming')" class="cat-btn bg-[#222] text-slate-300 px-3.5 py-1.5 rounded-full">Gaming</button>
    <button onclick="filterCategory(this, 'shorts')" class="cat-btn bg-[#222] text-slate-300 px-3.5 py-1.5 rounded-full">Shorts</button>
  </div>

  <!-- Search Form -->
  <form id="search-form" class="hidden p-3 bg-[#181818] border-b border-[#222] flex gap-2">
    <input type="text" id="search-input" placeholder="Dán ID Video hoặc từ khóa..." class="w-full px-4 py-2 bg-[#222] text-white text-sm rounded-xl focus:outline-none">
    <button type="submit" class="bg-accent-green text-black px-5 font-bold rounded-xl"><i class="fa-solid fa-magnifying-glass"></i></button>
  </form>

  <!-- Main Content Area -->
  <main id="main-content" class="p-3 min-h-[80vh] space-y-4"></main>

  <!-- Bottom Nav -->
  <nav id="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="switchTab('home')"><i class="fa-solid fa-house text-base mb-1"></i><span>Trang chủ</span></div>
    <div class="nav-item" id="nav-shorts" onclick="switchTab('shorts')"><i class="fa-solid fa-bolt text-base mb-1"></i><span>Shorts</span></div>
    <div class="nav-item" id="nav-music" onclick="switchTab('music')"><i class="fa-solid fa-circle-play text-base mb-1"></i><span>Music</span></div>
    <div class="nav-item" id="nav-library" onclick="switchTab('library')"><i class="fa-solid fa-bookmark text-base mb-1"></i><span>Thư viện</span></div>
  </nav>

  <!-- Fullscreen Player -->
  <div id="player-view">
    <div class="p-3 bg-black/90 flex items-center justify-between border-b border-[#222]">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-chevron-down text-lg text-white cursor-pointer" onclick="closePlayer()"></i>
        <span class="text-xs font-semibold text-slate-300">Đang phát không quảng cáo</span>
      </div>
      <i class="fa-solid fa-compress text-sm text-white cursor-pointer" onclick="togglePIP()"></i>
    </div>
    
    <div class="relative w-full aspect-video bg-black sticky top-0 z-10">
      <iframe id="video-iframe" class="w-full h-full border-0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>

    <div id="player-info-container" class="p-4 space-y-4">
      <div>
        <h1 id="video-title" class="text-sm font-bold text-white line-clamp-2 leading-snug">Đang tải video...</h1>
      </div>
      <div class="flex justify-around py-3 bg-[#181818] rounded-2xl border border-[#222]">
        <button class="flex flex-col items-center gap-1 text-[11px] text-slate-300" onclick="shareVideo()"><i class="fa-solid fa-share text-base accent-green"></i>Chia sẻ</button>
        <button class="flex flex-col items-center gap-1 text-[11px] text-slate-300" onclick="togglePIP()"><i class="fa-regular fa-window-restore text-base"></i>Pop-up</button>
        <button class="flex flex-col items-center gap-1 text-[11px] text-slate-300" onclick="saveToLibrary()"><i class="fa-regular fa-bookmark text-base"></i>Lưu</button>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-green-600 text-white text-xs px-4 py-2 rounded-full shadow-lg z-[500] hidden"></div>

  <script>
    const CHANNELS = {
      trending: ["UCq-Fj5jknLsUf-MWSy4_brA", "UCYvmuw-JtVrTZQ-7m4we62A", "UC_x5XG1OV2P6uZZ5FSM9Ttw"],
      music: ["UC-9-kyTW8ZkZNDHQJ6FgpwQ", "UC295-Pxo-wfKX8795nO-mjA"],
      gaming: ["UCpvm7pkZX49PZHFM2dIByng"],
      shorts: ["UCq-Fj5jknLsUf-MWSy4_brA"]
    };

    let currentCategory = 'trending';
    let currentVideo = null;
    let savedVideos = JSON.parse(localStorage.getItem('gt_saved_videos') || '[]');

    function toast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2500);
    }

    function showSkeletons() {
      const main = document.getElementById('main-content');
      main.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        main.innerHTML += `
          <div class="rounded-2xl overflow-hidden bg-[#181818] border border-[#222]">
            <div class="w-full aspect-video skeleton"></div>
            <div class="p-3 flex gap-3">
              <div class="w-9 h-9 rounded-full skeleton flex-shrink-0"></div>
              <div class="flex-1 space-y-2">
                <div class="h-3 skeleton rounded w-5/6"></div>
                <div class="h-2.5 skeleton rounded w-1/2"></div>
              </div>
            </div>
          </div>`;
      }
    }

    function showErrorUI() {
      const main = document.getElementById('main-content');
      main.innerHTML = `
        <div class="text-center py-16 px-4 space-y-3">
          <i class="fa-solid fa-wifi text-3xl text-slate-500"></i>
          <p class="text-xs text-slate-400">Kết nối bị gián đoạn hoặc máy chủ bận.</p>
          <button onclick="loadCategoryData(currentCategory)" class="bg-accent-green text-black font-bold text-xs px-5 py-2 rounded-full">Thử lại ngay</button>
        </div>`;
    }

    // Tải dữ liệu RSS qua API rss2json (Cực nhanh và ổn định)
    async function fetchYouTubeFeed(channelId) {
      const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;
      
      // Nguồn chính: rss2json API
      try {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
        if (res.ok) {
          const data = await res.json();
          if (data.status === 'ok' && data.items) {
            return data.items.map(item => {
              let videoId = item.link.includes('v=') ? item.link.split('v=')[1].split('&')[0] : item.guid.split(':').pop();
              return {
                id: videoId,
                title: item.title,
                author: item.author,
                thumbnail: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
              };
            });
          }
        }
      } catch (e) {}

      // Nguồn dự phòng: CorsProxy.io
      try {
        const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(rssUrl)}`);
        const xmlText = await res.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const entries = Array.from(xmlDoc.querySelectorAll("entry"));
        return entries.map(entry => {
          const videoId = entry.querySelector("videoId")?.textContent;
          return {
            id: videoId,
            title: entry.querySelector("title")?.textContent,
            author: entry.querySelector("name")?.textContent,
            thumbnail: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
          };
        });
      } catch (e) {}

      return [];
    }

    async function loadCategoryData(type) {
      currentCategory = type;
      showSkeletons();
      
      try {
        let results = [];
        const channelList = CHANNELS[type] || CHANNELS.trending;
        for (let cId of channelList) {
          const vids = await fetchYouTubeFeed(cId);
          results = results.concat(vids);
        }
        
        if (results.length > 0) {
          renderVideos(results);
        } else {
          showErrorUI();
        }
      } catch (err) {
        showErrorUI();
      }
    }

    function renderVideos(list) {
      const main = document.getElementById('main-content');
      main.innerHTML = '';

      if (!list || list.length === 0) {
        showErrorUI();
        return;
      }

      list.forEach(item => {
        if (!item.id) return;

        const card = document.createElement('div');
        card.className = "rounded-2xl overflow-hidden bg-[#181818] border border-[#222] cursor-pointer";
        card.onclick = () => playVideo(item);

        card.innerHTML = `
          <div class="relative aspect-video w-full bg-slate-900">
            <img src="${item.thumbnail}" class="w-full h-full object-cover" loading="lazy">
            <span class="absolute bottom-2 right-2 bg-black/80 text-white text-[10px] font-bold px-2 py-0.5 rounded-md">HD</span>
          </div>
          <div class="p-3 flex gap-3">
            <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${item.author || 'C'}" class="w-9 h-9 rounded-full flex-shrink-0 border border-slate-800">
            <div class="flex-1 overflow-hidden">
              <h3 class="text-xs font-semibold text-slate-100 line-clamp-2 leading-snug">${item.title}</h3>
              <p class="text-[11px] text-slate-400 mt-1">${item.author || 'YouTube Channel'}</p>
            </div>
          </div>
        `;
        main.appendChild(card);
      });
    }

    function playVideo(item) {
      currentVideo = item;
      const playerView = document.getElementById('player-view');
      const iframe = document.getElementById('video-iframe');
      
      document.getElementById('video-title').innerText = item.title;
      playerView.style.display = 'flex';
      iframe.src = `https://www.youtube-nocookie.com/embed/${item.id}?autoplay=1&modestbranding=1&rel=0`;
    }

    function filterCategory(btn, catType) {
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.className = "cat-btn bg-[#222] text-slate-300 px-3.5 py-1.5 rounded-full";
      });
      btn.className = "cat-btn bg-white text-black font-semibold px-3.5 py-1.5 rounded-full";
      loadCategoryData(catType);
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
      document.getElementById(`nav-${tab}`)?.classList.add('active');
      closePlayer();

      if (tab === 'home') loadCategoryData('trending');
      else if (tab === 'shorts') loadCategoryData('shorts');
      else if (tab === 'music') loadCategoryData('music');
      else if (tab === 'library') renderLibrary();
    }

    function renderLibrary() {
      const main = document.getElementById('main-content');
      if (savedVideos.length === 0) {
        main.innerHTML = `
          <div class="p-8 text-center text-slate-400 space-y-2">
            <i class="fa-solid fa-bookmark text-3xl text-slate-600 mb-2"></i>
            <p class="text-xs">Chưa có video nào được lưu.</p>
          </div>`;
      } else {
        renderVideos(savedVideos);
      }
    }

    function saveToLibrary() {
      if (!currentVideo) return;
      if (!savedVideos.some(v => v.id === currentVideo.id)) {
        savedVideos.push(currentVideo);
        localStorage.setItem('gt_saved_videos', JSON.stringify(savedVideos));
        toast("Đã lưu vào thư viện!");
      } else {
        toast("Video đã có trong thư viện!");
      }
    }

    function closePlayer() {
      document.getElementById('video-iframe').src = "";
      const p = document.getElementById('player-view');
      p.style.display = 'none';
      p.classList.remove('pip-mode');
    }

    function togglePIP() { document.getElementById('player-view').classList.toggle('pip-mode'); }
    function shareVideo() { navigator.clipboard.writeText(window.location.href); toast("Đã sao chép link!"); }
    function toggleSearch() { document.getElementById('search-form').classList.toggle('hidden'); }
    function reloadCurrentTab() { loadCategoryData(currentCategory); toast("Đã làm mới!"); }

    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = document.getElementById('search-input').value.trim();
      if (q) {
        if (q.length === 11) {
          playVideo({ id: q, title: "Video Tìm kiếm", author: "YouTube" });
        } else {
          toast("Vui lòng nhập Video ID (11 ký tự)");
        }
      }
    });

    // Chạy khi mở trang
    loadCategoryData('trending');
  </script>
</body>
</html>
